<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>buns3 tester</title>
  <script>
    // set theme before styles paint (no flash); stored choice wins over OS preference
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("buns3.theme") ??
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14161a; --panel: #1c1f25; --text: #d7dae0; --muted: #8b93a1;
      --border: #2a2e36; --border-strong: #3a404b;
      --accent: #e8a33d; --accent-text: #14161a; --ok: #5fb26a; --err: #d05f5f;
      --btn: #262b33; --pre: #aeb6c2;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f5f2; --panel: #ffffff; --text: #23272e; --muted: #64707d;
      --border: #d8dbe0; --border-strong: #b8bec7;
      --accent: #a56a10; --accent-text: #ffffff; --ok: #25823a; --err: #b8433c;
      --btn: #eceef1; --pre: #4b5563;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    .titlebar { display: flex; justify-content: space-between; align-items: baseline; }
    h1 { font-size: 18px; margin: 0 0 4px; } h1 span { color: var(--accent); }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 28px 0 8px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 2px; }
    input[type=text], input[type=password], input[type=number] { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font: inherit; }
    input:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; } .row > div { flex: 1; min-width: 180px; }
    button { background: var(--btn); color: var(--text); border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
    button:hover { border-color: var(--accent); } button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button.small { padding: 3px 10px; margin: 0; font-size: 12px; }
    .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); }
    .check label { margin: 0; }
    .log { display: flex; flex-direction: column; gap: 8px; }
    .entry { border: 1px solid var(--border); border-left-width: 4px; border-radius: 6px; padding: 8px 12px; background: var(--panel); }
    .entry.ok { border-left-color: var(--ok); } .entry.err { border-left-color: var(--err); }
    .entry .head { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .entry .status { font-weight: 700; } .ok .status { color: var(--ok); } .err .status { color: var(--err); }
    .entry .meta { color: var(--muted); font-size: 12px; }
    .entry pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; color: var(--pre); font-size: 12px; max-height: 200px; overflow: auto; }
    .entry a { color: var(--accent); }
    progress { width: 100%; height: 6px; margin-top: 10px; }
    .banner { border: 1px solid var(--err); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="titlebar">
      <h1><span>buns3</span> tester</h1>
      <button class="small" id="theme"></button>
    </div>
    <p class="sub">every request below is made by <code>@buns3/sdk</code>; the log shows the wire it produced</p>

    <div class="banner" id="loaderr" hidden></div>

    <h2>Connection</h2>
    <fieldset>
      <div class="row">
        <div><label>server</label><input type="text" id="base" /></div>
        <div><label>bucket</label><input type="text" id="bucket" /></div>
      </div>
      <label>api key (stored in localStorage)</label>
      <input type="password" id="key" placeholder="buns3_…" />
      <div class="check">
        <input id="anon" type="checkbox" />
        <label for="anon">anonymous — build the client without a token, to probe public-read</label>
      </div>
      <button id="whoami">whoami</button>
      <button id="serverinfo">server</button>
    </fieldset>

    <h2>Upload</h2>
    <fieldset>
      <label>file</label>
      <input type="file" id="file" />
      <div class="row">
        <div><label>key (defaults to filename)</label><input type="text" id="objectkey" /></div>
        <div><label>content-type (stored verbatim, no sniffing)</label><input type="text" id="ctype" placeholder="application/octet-stream" /></div>
      </div>
      <div class="row">
        <div><label>chunk size (bytes, chunked upload only)</label><input type="number" id="chunk" value="8388608" min="1" /></div>
      </div>
      <button class="primary" id="put">put</button>
      <button id="putchunked">putChunked</button>
      <progress id="progress" value="0" max="1" hidden></progress>
    </fieldset>

    <h2>Probe a key</h2>
    <fieldset>
      <label>object key</label>
      <input type="text" id="probekey" placeholder="README.md" />
      <button id="get">get</button>
      <button id="head">head</button>
      <button id="list">list</button>
      <button id="del">delete</button>
    </fieldset>

    <h2>Presigned</h2>
    <fieldset>
      <p class="sub" style="margin:0 0 4px">signed in this browser, with no round trip — the key never leaves the page</p>
      <div class="row">
        <div><label>method</label><input type="text" id="pmethod" value="GET" /></div>
        <div><label>ttl (seconds)</label><input type="number" id="pttl" value="600" min="0" /></div>
      </div>
      <button id="presign">presign object</button>
      <button id="follow">follow it (anonymous)</button>
      <pre id="presigned" class="sub" style="word-break:break-all"></pre>
    </fieldset>

    <h2>Log</h2>
    <div class="log" id="log"><p class="sub">nothing yet</p></div>
  </div>

  <script type="module">
    // Pinned exactly: this page is served from a bucket on the same origin as
    // your objects, so a floating version would be third-party code that can
    // change under you.
    import {
      Buns3Client,
      hashToken,
      deriveKeyId,
      sign,
      buildPresignedUrl,
    } from "https://esm.sh/@buns3/sdk@0.2.1";

    const $ = (id) => document.getElementById(id);
    const store = {
      get: (k, fallback) => { try { return localStorage.getItem(k) ?? fallback; } catch { return fallback; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    };

    // When served from a bucket (/<bucket>/<key>) infer the bucket from the URL.
    const seg = location.pathname.split("/").filter(Boolean);
    $("base").value = store.get("buns3.base", location.origin.startsWith("http") ? location.origin : "http://localhost:8000");
    $("bucket").value = store.get("buns3.bucket", seg.length >= 2 ? seg[0] : "testing");
    $("key").value = store.get("buns3.key", "");
    for (const [id, k] of [["base", "buns3.base"], ["bucket", "buns3.bucket"], ["key", "buns3.key"]]) {
      $(id).addEventListener("input", () => store.set(k, $(id).value));
    }

    const INTERESTING_HEADERS = [
      "etag", "content-type", "content-length", "last-modified",
      "content-disposition", "location", "www-authenticate", "content-range", "accept-ranges",
    ];

    const logEl = $("log");
    function append({ ok, status, method, url, ms, note, headers, body }) {
      if (logEl.firstElementChild?.tagName === "P") logEl.replaceChildren();
      const entry = document.createElement("div");
      entry.className = "entry " + (ok ? "ok" : "err");
      const short = url.replace($("base").value.replace(/\/+$/, ""), "") || "/";
      entry.innerHTML =
        `<div class="head"><span class="status"></span><span></span><span class="meta"></span></div>`;
      entry.querySelector(".status").textContent = status;
      const link = document.createElement("a");
      link.href = url; link.target = "_blank"; link.rel = "noreferrer";
      link.textContent = decodeURIComponent(short);
      const middle = entry.querySelector(".head span:nth-child(2)");
      middle.append(method + " ", link);
      entry.querySelector(".meta").textContent = `${ms}ms${note ? " · " + note : ""}`;
      for (const text of [headers, body]) {
        if (!text) continue;
        const pre = document.createElement("pre");
        pre.textContent = text;
        entry.append(pre);
      }
      logEl.prepend(entry);
    }

    // The SDK's fetch seam: every request it makes passes through here, so the
    // log shows what the SDK actually sent rather than what this page intended.
    async function loggedFetch(input, init = {}) {
      const url = typeof input === "string" ? input : input.url;
      const method = init.method ?? "GET";
      const started = performance.now();
      try {
        const res = await fetch(input, init);
        const ms = Math.round(performance.now() - started);
        const headers = INTERESTING_HEADERS
          .map((h) => [h, res.headers.get(h)])
          .filter(([, v]) => v !== null)
          .map(([h, v]) => `${h}: ${v}`)
          .join("\n");

        // Read the body from a clone so the SDK still gets an unconsumed one.
        let body = "";
        if (method !== "HEAD") {
          const text = await res.clone().text().catch(() => "");
          body = text.length > 2000 ? `${text.slice(0, 2000)}\n… (${text.length} bytes total)` : text;
        }
        append({ ok: res.ok, status: `${res.status} ${res.statusText}`, method, url, ms, headers, body });
        return res;
      } catch (err) {
        append({
          ok: false, status: "network error", method, url,
          ms: Math.round(performance.now() - started), headers: "", body: String(err),
        });
        throw err;
      }
    }

    const client = () =>
      new Buns3Client($("base").value, {
        token: $("anon").checked ? undefined : $("key").value || undefined,
        fetch: loggedFetch,
      });

    const bucket = () => $("bucket").value;
    const file = () => $("file").files?.[0] ?? null;
    const keyOf = () => $("objectkey").value || file()?.name || "";
    const probeKey = () => $("probekey").value || keyOf();

    // A failure that never reached the wire (a refused create, say) has no log
    // entry of its own, so surface it.
    function note(result, label) {
      if (!result.success) {
        append({ ok: false, status: `${result.status} ${result.code}`, method: "", url: label, ms: 0, headers: "", body: result.detail ?? "" });
      }
      return result;
    }

    async function busy(button, fn) {
      const buttons = document.querySelectorAll("button");
      buttons.forEach((b) => (b.disabled = true));
      try { await fn(); } finally { buttons.forEach((b) => (b.disabled = false)); }
    }

    $("file").addEventListener("change", () => {
      const f = file();
      if (!f) return;
      $("objectkey").value = f.name;
      $("ctype").value = f.type || "";
      $("probekey").value = f.name;
    });

    $("put").addEventListener("click", () => busy($("put"), async () => {
      const f = file();
      if (!f) return;
      note(await client().objects.put(bucket(), keyOf(), f, { contentType: $("ctype").value || undefined }), "put");
    }));

    $("putchunked").addEventListener("click", () => busy($("putchunked"), async () => {
      const f = file();
      if (!f) return;
      const bar = $("progress");
      bar.hidden = false;
      bar.value = 0;
      try {
        note(
          await client().objects.putChunked(bucket(), keyOf(), f, {
            contentType: $("ctype").value || undefined,
            chunkSize: Number($("chunk").value) || undefined,
            onProgress: (uploaded, total) => { bar.value = total === 0 ? 1 : uploaded / total; },
          }),
          "putChunked",
        );
      } finally {
        setTimeout(() => { bar.hidden = true; }, 1500);
      }
    }));

    $("get").addEventListener("click", () => busy($("get"), async () => {
      note(await client().objects.get(bucket(), probeKey()), "get");
    }));
    $("head").addEventListener("click", () => busy($("head"), async () => {
      note(await client().objects.head(bucket(), probeKey()), "head");
    }));
    $("list").addEventListener("click", () => busy($("list"), async () => {
      note(await client().objects.list(bucket()), "list");
    }));
    $("del").addEventListener("click", () => busy($("del"), async () => {
      if (!confirm(`delete ${probeKey()}?`)) return;
      note(await client().objects.delete(bucket(), probeKey()), "delete");
    }));
    $("whoami").addEventListener("click", () => busy($("whoami"), async () => {
      note(await client().self.whoami(), "whoami");
    }));
    $("serverinfo").addEventListener("click", () => busy($("serverinfo"), async () => {
      note(await client().server.get(), "server");
    }));

    // Signed here, in the browser, from the key alone: no request, so nothing
    // appears in the log until the URL is followed.
    $("presign").addEventListener("click", () => busy($("presign"), async () => {
      const token = $("key").value;
      if (!token) { $("presigned").textContent = "needs an api key"; return; }
      const tokenHash = await hashToken(token);
      const expires = Math.floor(Date.now() / 1000) + (Number($("pttl").value) || 600);
      const url = buildPresignedUrl($("base").value.replace(/\/+$/, ""), bucket(), probeKey(), {
        keyId: await deriveKeyId(tokenHash),
        expires,
        sig: await sign({ tokenHash, method: $("pmethod").value.toUpperCase(), bucket: bucket(), key: probeKey(), expires }),
      });
      $("presigned").textContent = url;
    }));

    $("follow").addEventListener("click", () => busy($("follow"), async () => {
      const url = $("presigned").textContent;
      if (!url.startsWith("http")) return;
      const anonymous = new Buns3Client($("base").value, { fetch: loggedFetch });
      note(await anonymous.presigned.get(url), "follow presigned");
    }));

    const themeBtn = $("theme");
    function paintTheme() {
      themeBtn.textContent = document.documentElement.dataset.theme === "light" ? "☾ dark" : "☀ light";
    }
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("buns3.theme", next); } catch {}
      paintTheme();
    });
    paintTheme();
  </script>
  <script type="module">
    // A module that fails to import is silent; say so rather than showing a
    // page whose buttons do nothing.
    setTimeout(() => {
      if (!document.getElementById("theme").textContent) {
        const b = document.getElementById("loaderr");
        b.hidden = false;
        b.textContent = "could not load @buns3/sdk from esm.sh — check the network tab";
      }
    }, 4000);
  </script>
</body>
</html>
